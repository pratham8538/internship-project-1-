<!-- Registration Card -->
<main class="w-full max-w-[480px] bg-surface rounded-xl custom-shadow p-lg md:p-xl relative z-10 border border-surface-container-highest">
<!-- Header -->
<div class="text-center mb-xl">
<div class="flex justify-center items-center gap-2 mb-md text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="local_pizza" data-weight="fill" style='font-variation-settings: "FILL" 1;'>local_pizza</span>
<h1 class="font-display-lg text-headline-md font-bold tracking-tight">PIZZANIA</h1>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join us and enjoy the best pizzas.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-md" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="name">Full Name</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-surface-container-highest rounded-lg px-md py-sm pl-12 text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md" id="name" name="name" placeholder="Enter your name" required="" type="text"/>
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="person">person</span>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="email">Email</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-surface-container-highest rounded-lg px-md py-sm pl-12 text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="mail">mail</span>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-surface-container-highest rounded-lg px-md py-sm pl-12 pr-12 text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md" id="password" name="password" placeholder="Create a password" required="" type="password"/>
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="lock">lock</span>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="confirm-password">Confirm Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-surface-container-highest rounded-lg px-md py-sm pl-12 pr-12 text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required="" type="password"/>
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="lock_reset">lock_reset</span>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full bg-primary-container text-on-primary font-label-lg text-label-lg py-sm rounded-lg shadow-sm hover:bg-secondary transition-colors focus:ring-4 focus:ring-primary-fixed focus:outline-none flex justify-center items-center gap-2" type="submit">
                    REGISTER
                </button>
</div>
<!-- Or Divider -->
<div class="flex items-center gap-4 py-sm">
<div class="h-px bg-surface-container-highest flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="h-px bg-surface-container-highest flex-1"></div>

               Google
